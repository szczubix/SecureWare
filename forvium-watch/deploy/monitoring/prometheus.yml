# Prometheus dla Forvium Watch (profil `monitoring` w compose.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  # Kazda replika API osobno (DNS usługi `api` zwraca wszystkie repliki).
  - job_name: forvium-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
